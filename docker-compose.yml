version: '3'

services:
  catalog-app-service:
    image: catalog-app

    build: .

    container_name: catalog-app-container

    ports:
      - 3000:8080

    environment:
      PUBLIC_URL: ''
      MAP_CENTER: '[34.817, 31.911]'
      MAP_ZOOM: 14
      DEFAULT_TERRAIN_PROVIDER_URL: ''
      MAP_SERVICE_RASTER_URL: ''
      WS_PROTOCOL: 'ws://'
      SERVICE_PROTOCOL: 'http://'
      SERVICE_NAME: 'localhost:8080'
    restart: unless-stopped
